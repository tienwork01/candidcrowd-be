name: candid-crowd

services:
  api:
    image: ${API_IMAGE:-ghcr.io/tienwork01/candidcrowd-be:latest}
    env_file:
      - .env
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in /opt/candid-crowd/.env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in /opt/candid-crowd/.env}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 35s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
