name: Build and deploy production

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Deploy and verify readiness
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "API_IMAGE='$IMAGE_NAME:$GITHUB_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail

          cd /opt/candid-crowd
          test -f docker-compose.yml
          test -f .env

          export API_IMAGE
          docker compose config --quiet
          docker compose pull api
          docker compose up -d --wait --wait-timeout 180 api

          ready=false
          for attempt in $(seq 1 36); do
            if response="$(curl --fail --silent http://127.0.0.1:8080/readyz)" \
              && printf '%s' "$response" | grep -q '"status":"ready"'; then
              printf '%s\n' "$response"
              ready=true
              break
            fi
            sleep 5
          done

          if [ "$ready" != true ]; then
            echo "API readiness check failed" >&2
            docker compose logs --tail=100 api >&2
            exit 1
          fi

          docker image prune -f
          REMOTE
